plugins {
	// 26.1+ is unobfuscated: non-remapping Loom, no mappings, plain `implementation`.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add extra mod repositories here (e.g. Modrinth maven for Mod Menu).
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [
		"version"          : project.version,
		"minecraft_version": project.minecraft_version,
		"loader_version"   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}

	// Shared data tables (data/ submodule) bundled as the offline fallback — see docs/data.md.
	from("data") {
		// the tables the mod reads (TelosData)
		include("tables/*.json")
		into "assets/telemetric/data"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// Optional machine-local build additions (git-ignored).
if (file('local.gradle').exists()) {
	apply from: 'local.gradle'
}
